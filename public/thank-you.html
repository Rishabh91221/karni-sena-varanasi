<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7B1E1E">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- ============ OPEN GRAPH ============ -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="क्षत्रिय करणी सेना — वाराणसी">
    <meta property="og:title" content="आवेदन सफल — क्षत्रिय करणी सेना वाराणसी">
    <meta property="og:description" content="आपका आवेदन सफलतापूर्वक जमा हो गया है। हमारी टीम शीघ्र ही आपसे संपर्क करेगी।">
    <meta property="og:url" content="https://karni-sena-varanasi.pages.dev/thank-you.html">
    <meta property="og:image" content="https://karni-sena-varanasi.pages.dev/assets/logo.png">
    <meta property="og:image:alt" content="क्षत्रिय करणी सेना वाराणसी का लोगो">
    <meta property="og:locale" content="hi_IN">

    <!-- ============ TWITTER / X ============ -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="आवेदन सफल — क्षत्रिय करणी सेना वाराणसी">
    <meta name="twitter:description" content="आपका आवेदन सफलतापूर्वक जमा हो गया है।">
    <meta name="twitter:image" content="https://karni-sena-varanasi.pages.dev/assets/logo.png">

    <!-- ============ CANONICAL ============ -->
    <link rel="canonical" href="https://karni-sena-varanasi.pages.dev/thank-you.html">

    <!-- ============ FONTS ============ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- ============ STYLES ============ -->
    <link rel="stylesheet" href="/css/thank-you.css">
    <link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

    <main class="thankyou-page" role="main">

        <!-- ============ DECORATIVE BACKGROUND ============ -->
        <div class="om-bg" aria-hidden="true">ॐ</div>
        <div class="om-bg om-bg-2" aria-hidden="true">ॐ</div>
        <div class="om-bg om-bg-3" aria-hidden="true">ॐ</div>

        <!-- ============ FLOATING PARTICLES ============ -->
        <div class="particles" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>

        <!-- ============ CONTENT ============ -->
        <div class="thankyou-content" role="status" aria-live="polite">

            <!-- Success checkmark -->
            <div class="thankyou-check" aria-hidden="true">
                <svg viewBox="0 0 52 52" class="check-svg" focusable="false">
                    <circle class="check-circle" cx="26" cy="26" r="24" fill="none"/>
                    <path class="check-mark" fill="none" d="M14 27l8 8 16-16"/>
                </svg>
            </div>

            <!-- Organization header -->
            <div class="org-header">
                <img src="/assets/logo.png"
                     alt="क्षत्रिय करणी सेना का लोगो"
                     class="org-logo"
                     width="42"
                     height="42">
                <div class="org-name">क्षत्रिय करणी सेना — वाराणसी</div>
            </div>

            <!-- Primary message -->
            <h1 class="thankyou-message" id="thankyou-message">
                आपका आवेदन सफलतापूर्वक जमा हो गया है
            </h1>

            <!-- Sub message -->
            <p class="thankyou-sub" id="thankyou-sub">
                हमारी टीम शीघ्र ही आपसे संपर्क करेगी।
            </p>

            <!-- Reference ID (shown only when a valid numeric ?id=N is in URL) -->
            <div class="ref-box" id="ref-box" style="display:none;">
                <span class="ref-label">आपका आवेदन संदर्भ:</span>
                <span class="ref-id" id="ref-id">—</span>
            </div>

            <!-- Shloka divider -->
            <div class="shloka-divider" aria-hidden="true">
                <span class="divider-line"></span>
                <span class="divider-om">ॐ</span>
                <span class="divider-line"></span>
            </div>

            <!-- Shloka -->
            <div class="shloka-box">
                <blockquote class="shloka-text">
                    अहिंसा परमो धर्मः धर्म हिंसा तथैव च
                </blockquote>
            </div>

            <!-- Actions -->
            <div class="thankyou-actions">
                <a href="/" class="btn btn-primary">मुख्य पृष्ठ पर वापस जाएँ</a>
            </div>

            <!-- Contact reminder -->
            <p class="contact-reminder">
                किसी भी सहायता के लिए संपर्क करें:
                <br>
                <a href="tel:8756799602" rel="noopener">📞 8756799602</a>
                &nbsp;·&nbsp;
                <a href="tel:9140915534" rel="noopener">📞 9140915534</a>
            </p>
        </div>
    </main>

    <!-- ============ REFERENCE ID SCRIPT ============ -->
    <script>
        (function () {
            'use strict';
            try {
                const params = new URLSearchParams(window.location.search);
                const rawId = params.get('id');

                // Strict validation: 1-10 digits only (prevents XSS / injection)
                if (rawId && /^\d{1,10}$/.test(rawId)) {
                    const refIdEl = document.getElementById('ref-id');
                    const refBoxEl = document.getElementById('ref-box');

                    if (refIdEl && refBoxEl) {
                        refIdEl.textContent = '#' + rawId;
                        refBoxEl.style.display = 'inline-flex';
                    }
                }
            } catch (e) {
                // Silent fail — never break page render
            }
        })();
    </script>
</body>
</html>
