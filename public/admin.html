<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7B1E1E">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Admin — क्षत्रिय करणी सेना वाराणसी</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="login-screen" class="login-screen" role="main">
    <div class="login-card">
        <img src="/assets/logo.png" 
             alt="क्षत्रिय करणी सेना का लोगो" 
             class="login-logo"
             width="80"
             height="80">
        <h1>Admin Panel</h1>
        <p class="login-sub">क्षत्रिय करणी सेना — वाराणसी</p>

        <form id="login-form" autocomplete="off" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input type="text" 
                       id="username" 
                       name="username"
                       placeholder="Enter username" 
                       required 
                       autocomplete="username"
                       autocapitalize="off"
                       spellcheck="false">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" 
                       id="password" 
                       name="password"
                       placeholder="Enter password" 
                       required 
                       autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="login-btn">Log In</button>
            <div class="login-error" id="login-error" role="alert" aria-live="polite"></div>
        </form>

        <a href="/" class="back-home">← मुख्य पृष्ठ पर वापस जाएँ</a>
    </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dashboard" class="dashboard" style="display:none;" role="main">

    <!-- Top bar -->
    <header class="admin-header">
        <div class="admin-header-left">
            <img src="/assets/logo.png" 
                 alt="लोगो" 
                 class="admin-logo"
                 width="42"
                 height="42">
            <div>
                <strong>Admin Dashboard</strong>
                <small>क्षत्रिय करणी सेना — वाराणसी</small>
            </div>
        </div>
        <div class="admin-header-right">
            <a href="/" class="btn-text">← Site</a>
            <button id="logout-btn" class="btn-text" type="button">Log Out</button>
        </div>
    </header>

    <main class="admin-main">

        <!-- ============ STATS CARDS ============ -->
        <section class="stats-grid" aria-label="Statistics">
            <div class="stat-card">
                <div class="stat-icon" aria-hidden="true">📊</div>
                <div class="stat-value" id="stat-total">—</div>
                <div class="stat-label">कुल आवेदन</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" aria-hidden="true">📅</div>
                <div class="stat-value" id="stat-today">—</div>
                <div class="stat-label">आज</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" aria-hidden="true">📈</div>
                <div class="stat-value" id="stat-week">—</div>
                <div class="stat-label">इस हफ़्ते</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" aria-hidden="true">🗓️</div>
                <div class="stat-value" id="stat-month">—</div>
                <div class="stat-label">इस महीने</div>
            </div>
        </section>

        <!-- ============ TOOLBAR ============ -->
        <section class="toolbar" aria-label="Filters">
            <div class="toolbar-left">
                <input type="search" 
                       id="search-input" 
                       placeholder="🔍 नाम, मोबाइल, आधार से खोजें..." 
                       aria-label="Search submissions">
                <input type="date" 
                       id="date-from" 
                       title="From date" 
                       aria-label="Filter from date">
                <input type="date" 
                       id="date-to" 
                       title="To date" 
                       aria-label="Filter to date">
                <button id="clear-filters" class="btn-text" type="button">Clear</button>
            </div>
            <div class="toolbar-right">
                <button id="refresh-btn" class="btn btn-outline btn-small" type="button">🔄 Refresh</button>
                <button id="export-btn" class="btn btn-primary btn-small" type="button">📥 Export CSV</button>
            </div>
        </section>

        <!-- ============ TABLE ============ -->
        <section class="table-wrap">
            <div class="table-status" id="table-status" role="status" aria-live="polite">लोड हो रहा है...</div>
            <table class="submissions-table" id="submissions-table" style="display:none;">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">नाम</th>
                        <th scope="col">पिता का नाम</th>
                        <th scope="col">मोबाइल</th>
                        <th scope="col">आधार</th>
                        <th scope="col">जिला</th>
                        <th scope="col">फोटो</th>
                        <th scope="col">दिनांक</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </section>

    </main>
</div>

<!-- ============ DETAIL MODAL ============ -->
<div class="modal-backdrop" id="modal-backdrop" style="display:none;" aria-hidden="true">
    <div class="modal" role="dialog" aria-labelledby="modal-title" aria-modal="true">
        <div class="modal-header">
            <h2 id="modal-title">आवेदन विवरण</h2>
            <button id="modal-close" class="modal-close" aria-label="Close modal" type="button">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
